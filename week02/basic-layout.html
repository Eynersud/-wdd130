<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML Structure example using semantic HTML elements">
    <meta name="author" content="John Otieno">


</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="basic-logo" width="200" height="200">

    </header>
    <nav>
        <ul>
            <li><a href="https://byui.edu">BYU Idaho</a></li>
            <li><a href="https://churchofjesuschrist.org">The Church of Jesus Christ of Latter-day
                    Saints</a></li>

        </ul>
    </nav>
    <main>
        <h1> Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>This is a simple example of a basic HTML structure using semantic elements.</p>
        </section>
        <section>

            <h2> Heading</h2>
            <p>This is another paragraph in the main content area.</p>
        </section>

    </main>
    <aside>
        <img
          src="https://media.cnn.com/api/v1/images/stellar/prod/190419150647-salt-lake-city-temple.jpg?q=w_3000,h_2000,x_0,y_0,c_fill"
          alt="Salt lake City temple " width="600">
    </aside>
    <footer>
        <p>&copy 2026 Eyner Oliveros. All rights reserved.</p>
    </footer>


</body>

</html>
